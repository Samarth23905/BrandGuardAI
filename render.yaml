services:
  # ----------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------
  - type: web
    name: brandguard-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render dashboard (e.g. your MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # Set to your deployed frontend URL (e.g. https://brandguard-frontend.onrender.com)
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API key
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: USE_ATLAS_VECTOR_SEARCH
        value: false

  # ----------------------------------------------------
  # Frontend Static Site (SPA)
  # ----------------------------------------------------
  - type: static
    name: brandguard-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed backend URL + /api/v1 (e.g. https://brandguard-backend.onrender.com/api/v1)
